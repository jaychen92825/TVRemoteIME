<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
	<title>TapTV</title>
	<meta name="layoutmode" content="standard">
	<meta name="theme-color" content="#3ea6ff">
	<link rel="manifest" href="/manifest.json">
	<link rel="icon" href="/icon.png">
	<link rel="apple-touch-icon" href="/icon.png">
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div class="container">
	    <div class="tabs-row">
		<div class="tabs">
		  <div class="tab cur" data-rel="controls">
			  <svg viewBox="0 0 24 24" width="14" height="14"><rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="6" y1="10" x2="6" y2="10.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="10" x2="10" y2="10.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="10" x2="14" y2="10.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="10" x2="18" y2="10.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="14" x2="17" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
			  输入遥控
		  </div>
		  <div class="tab" data-rel="app">
			  <svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
			  应用管理
		  </div>
		  <div class="tab" data-rel="file">
			  <svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6z" fill="currentColor"/></svg>
			  文件管理
		  </div>
		  <div class="tab" data-rel="video">
			  <svg viewBox="0 0 24 24" width="14" height="14"><rect x="2" y="4" width="20" height="13" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 8l6 3-6 3V8z" fill="currentColor"/><line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
			  视频直播
		  </div>
		</div>
		</div>
		<div class="main-wrapper" data-tab="controls">
			<div class="inputarea-wrapper">
				<textarea id="inputarea" rows="2" placeholder="点此为电视输入文字"></textarea>
			</div>
		</div>
		<div class="btn-line" data-tab="controls">
		    <div class="btn" id="btnDel" data-key='67'><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-6-7 6-7z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><line x1="11" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="17" y1="9" x2="11" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>退格</div>
		    <div class="btn" id="btnEnter"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M19 5v7a2 2 0 0 1-2 2H7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11l-4 3 4 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>回车</div>
		    <div class="btn" id="btnCls" data-key='cls'><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>清空</div>
		    <div class="btn" id="btnToggleKeyboard" title="显示/隐藏电视端软键盘（默认隐藏，用控制端打字不需要它）"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="7" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="6.5" y1="10.5" x2="6.5" y2="10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="10.5" x2="10" y2="10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="13.5" y1="10.5" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="10.5" x2="17" y2="10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="14.5" x2="16" y2="14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>键盘</div>
		</div>
		<div class="keys" data-tab="controls">
			<div class="remote-panel">
				<div class="remote-row remote-row-secondary">
					<div class="otherbtn round-btn" id="sleep-btn" data-key='sleep' title="睡眠（需先在电视盒子「设置-无障碍」里开启TapTV服务；只能让电视休眠，不能反过来唤醒）">
						<svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M7 6a8 8 0 1 0 10 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
					</div>
					<div class="otherbtn round-btn" id="vol-btn" data-key='164' title="静音">
						<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M17 8l4 8M21 8l-4 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
					</div>
					<div class="otherbtn round-btn vol-btn-text" id="vol2-btn" data-key='25' title="音量减">－</div>
					<div class="otherbtn round-btn vol-btn-text" id="vol1-btn" data-key='24' title="音量加">＋</div>
				</div>
				<div class="mode-tabs">
					<div class="mode-tab active" data-mode="dpad">
						<svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2l3 3h-2v4h4V7l3 3-3 3v-2h-4v4h2l-3 3-3-3h2v-4H6v2l-3-3 3-3v2h4V5H8l3-3z" fill="currentColor"/></svg>
						方向键
					</div>
					<div class="mode-tab" data-mode="elements">
						<svg viewBox="0 0 24 24" width="13" height="13"><rect x="3" y="4" width="3" height="3" fill="currentColor"/><rect x="3" y="10.5" width="3" height="3" fill="currentColor"/><rect x="3" y="17" width="3" height="3" fill="currentColor"/><line x1="9" y1="5.5" x2="21" y2="5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="18.5" x2="21" y2="18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
						元素列表
					</div>
				</div>
				<div class="nav-mode" data-mode="dpad">
					<div id="direction-btns" class="direction-btns">
						<div class="direction left-btn" id="left-btn" data-key='21'>◀</div>
						<div class="direction top-btn" id="top-btn" data-key='19'>▲</div>
						<div class="direction right-btn" id="right-btn" data-key='22'>▶</div>
						<div class="direction bottom-btn" id="bottom-btn" data-key='20'>▼</div>
						<div class="direction center-btn" id="center-btn" data-key='23'></div>
					</div>
				</div>
			</div>
			<div class="nav-mode hide" data-mode="elements">
				<div class="elements-toolbar">
					<span class="elements-status" id="elementsStatus">检测中…</span>
					<div class="btn" id="btnRefreshElements" style="margin-right:0;"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M20 11A8 8 0 1 0 18.5 16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M20 5v6h-6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>刷新</div>
				</div>
				<div class="elements-list" id="elementsList"></div>
			</div>
			<div class="remote-panel">
				<div class="remote-row remote-row-nav">
					<div class="otherbtn round-btn" id="home-btn" data-key='3' title="主页">
						<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-9z" fill="currentColor"/></svg>
					</div>
					<div class="otherbtn round-btn" id="back-btn" data-key='4' title="返回">
						<svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</div>
					<div class="otherbtn round-btn" id="menu-btn" data-key='82' title="菜单">
						<svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
					</div>
					<div class="otherbtn round-btn" id="recents-btn" data-key='187' title="多任务">
						<svg viewBox="0 0 24 24" width="20" height="20"><rect x="7" y="7" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 14V6a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
					</div>
				</div>
			</div>
		</div>
		<div class="app-panel hide" data-tab="app">
			<div class="app-un">
		    <a class="showSettings" id="showSettings"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.4 2.6"/></svg>系统设置</a>
			<label class="blue"><input type="checkbox" id="cbListSystem">显示系统应用</label>
			<label style="color:#e5484d;"><input type="checkbox" id="cbUninstall">卸载应用</label></div>
			<div class="app-list"></div>
		</div>
		<div class="app-upload" data-tab="controls">
		    <input type="file" id="upfile" value=".." />
		    <div class="upload-btn" id="btnUpload"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 18a4 4 0 0 1-1-7.87A5 5 0 0 1 16 8h.5a3.5 3.5 0 0 1 .5 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 15l3-3 3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>传送文件</div>
			<div class="upload-process">
			    <div class="processbar" id="processbar1"></div>
			</div>
		    <div class="upload-btn" id="btnClear"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>清除缓存</div>
		</div>
		<div class="upload-settings" data-tab="controls">
		   <label style="margin-right:10px;"><input type="checkbox" checked="checked" id="cbAutoInstall">传送后自动安装APK文件或播放视频文件</label>
		   <div class="version-watermark"><span id="deviceNameWatermark"></span>V<span id="curVer">1.0</span></div>
	    </div>
		<div class="play-line hide" data-tab="video">
		   <div class="card">
			   <div class="card-title">网络视频</div>
			   <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#8c8c8c;margin-bottom:8px;">
				   <span>支持http/ftp/thunder/ed2k/rtmp/mms</span>
				   <a href="javascript:$('#playUrl').val('');" style="color:#8c8c8c;display:inline-flex;align-items:center;gap:2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;"><svg viewBox="0 0 24 24" width="11" height="11"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>清空地址</a>
			   </div>
			   <div style="display:flex;gap:8px;">
				   <input type="text" id="playUrl" placeholder="网络视频地址" value="" style="flex:1;" />
				   <div class="btn" id="btnPlay" style="margin-right:0;"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 5l12 7-12 7V5z" fill="currentColor"/></svg>远程播放</div>
			   </div>
		   </div>
		   <div class="card">
			   <div class="card-title">播放设置</div>
			   <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:12px;color:#555;">
				   <label>每次快进<input type="text" id="speedInterval" maxlength="3" value="5" style="width:30px;height:22px;margin:0 4px;" />秒</label>
				   <label><input type="checkbox" id="playUseSystem">调用系统播放器</label>
				   <div class="btn1 app-btn1" id="stopPlay"><svg viewBox="0 0 24 24" width="12" height="12"><rect x="5" y="5" width="14" height="14" rx="1.5" fill="currentColor"/></svg>停止边下边播任务</div>
			   </div>
		   </div>
		   <div class="card">
			   <div class="card-title">种子视频</div>
			   <div style="position: relative;">
				   <input type="file" id="upfile3" value="..">
				   <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
					   <input type="button" value="上传种子" class="btn" id="btnUploadTorrent" style="margin-right:0;">
					   <div class="btn" id="btnPlayTorrent" style="margin-right:0;"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 5l12 7-12 7V5z" fill="currentColor"/></svg>开始播放</div>
					   <select style="height:30px;flex:1;min-width:115px;" id="torrentItems">
					   </select>
				   </div>
			   </div>
		   </div>
		   <div class="card">
			   <div class="tv-panel-title" style="margin-top:0;border-top:none;height:auto;padding-right:0;">
				  <div style="flex:1;margin-bottom:0;" class="card-title">电视节目</div>
				  <div style="font-size:12px;">需要更改直播源请<a style="color:red;display:inline-flex;align-items:center;gap:2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;" id="btnShowTVEdit"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M4 20l1-4 11-11 3 3-11 11-4 1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>点击这里</a></div>
			   </div>
			   <div class="tv-items"></div>
		   </div>
		   <div class="tv-edit hide card">
		      <textarea style="width:98%;height:500px" id="tvData"></textarea><br />
              <div class="btn" id="btnTVEdit"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 13l4 4 10-10" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>修改</div>
			  <div class="btn" id="btnTVCancel"><svg viewBox="0 0 24 24" width="14" height="14"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>取消</div>
		  </div>
	    </div>
		<div class="file-panel hide" data-tab="file">
		   <div class="file-un">
			   <div class="file-upload">
					<input type="file" id="upfile2" value=".." />
					<div class="btn" id="btnUpload2"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 18a4 4 0 0 1-1-7.87A5 5 0 0 1 16 8h.5a3.5 3.5 0 0 1 .5 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 15l3-3 3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>上传文件</div>
					<div class="upload-process" style="height:30px">
						<div class="processbar" id="processbar2"></div>
					</div>
			   </div>
			   <label><input type="checkbox" id="cbFileSelect">选择</label>
		   </div>
		   <div class="file-oper hide">
		       <div class="file-oper-items">
			   </div>
			   <div style="text-align:right">
					<div class="btn" id="btnCopy" onclick="postFileAction('copy');"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="8" y="8" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 15V5a1 1 0 0 1 1-1h10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>复制</div>
					<div class="btn" id="btnCut" onclick="postFileAction('cut');"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="6" cy="6" r="2.2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="6" cy="18" r="2.2" stroke="currentColor" stroke-width="1.6" fill="none"/><line x1="7.8" y1="7.5" x2="20" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="7.8" y1="16.5" x2="20" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>剪切</div>
					<div class="btn" id="btnDelete" onclick="postFileAction('delete');" style="color:red"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>删除</div>
			   </div>
		   </div>
		   <div class="file-disk">
			   <div style="text-align:right;font-size:12px;padding-right:5px;padding-bottom:5px;" id="diskSpace"></div>
			   <div id="curPath"></div>
			   <div class="file-list"></div>
		   </div>
	    </div>
	</div>
	<script src="/jquery_min.js"></script>
	<script src="/ime_core.js"></script>
	<script>
	if("serviceWorker" in navigator){
		window.addEventListener("load", function(){
			navigator.serviceWorker.register("/sw.js").catch(function(e){
				console.log("service worker注册失败", e);
			});
		});
	}
	</script>
</body>
</html>
