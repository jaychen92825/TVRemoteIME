<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
	<title>正在登录</title>
</head>
<body style="font-family:sans-serif;text-align:center;color:#888;padding-top:40vh;background:#222;">
	<div>正在登录，请稍候…</div>
	<script>
	(function(){
		function goHome(){ location.replace("/"); }
		var hash = location.hash || "";
		if(hash.charAt(0) === "#") hash = hash.substring(1);
		var code = "";
		var parts = hash.split("&");
		for(var i = 0; i < parts.length; i++){
			var kv = parts[i].split("=");
			if(kv[0] === "code"){
				code = decodeURIComponent(kv[1] || "");
				break;
			}
		}
		if(!code){
			goHome();
			return;
		}
		//用带Authorization头的请求预热浏览器对本站的Basic认证缓存，这样接下来
		//跳转到首页时浏览器会自动带上凭据，不用再弹原生登录框手动输入口令。
		//口令放在URL的#片段里而不是查询字符串，片段不会被发送到服务器/写进
		//访问日志，只有这段脚本能读到。
		var xhr = new XMLHttpRequest();
		xhr.open("GET", "/", true);
		xhr.setRequestHeader("Authorization", "Basic " + btoa("tvremoteime:" + code));
		xhr.onload = goHome;
		xhr.onerror = goHome;
		xhr.send();
	})();
	</script>
</body>
</html>
