apply plugin: 'com.android.application'

// release签名：之前release构建没有配signingConfig，CI每次都产出未签名包，debug构建
// 则是用Gradle默认行为（每台机器/每次CI运行如果本地没有~/.android/debug.keystore就
// 现场随机生成一个）——这导致不同批次构建出来的APK签名互不相同，覆盖式安装时系统会报
// "签名不一致"必须先卸载旧版。debug.keystore直接提交进仓库（debug key本来就不是用来
// 代表"可信任的正式发布者"身份的，密码是Android官方约定俗成的公开值，提交它没有额外
// 安全风险，只是为了让每一次构建都用同一把debug key），保证所有人、所有CI跑出来的
// debug包永远同一个签名，可以互相覆盖安装。
// release签名走的是环境变量（CI里由GitHub仓库Secret注入、解码成文件），私钥本身
// 不会进版本库；本地不设这些环境变量时release构建保持未签名，行为跟之前一致。
def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && new File(releaseKeystorePath).exists() &&
        releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

// App内"检查更新"功能靠versionCode数值比较判断有没有新版本；如果这个数字靠人
// 每次改动手动去改build.gradle才递增，几乎必然会有忘记改的时候（这个项目本身
// 就已经忘过好几次——一连四个commit合入master都没提这个数，导致GitHub Release
// 的tag/APK内容早就更新了，但App一直以为"已经是最新版"检测不出来）。改成CI
// 构建时通过APP_VERSION_CODE环境变量传入github.run_number（每次工作流运行都
// 严格递增，不会重复/倒退），彻底交给CI自动维护，人不用再记得手动改这个数字；
// 本地不设这个环境变量时用后面这个静态兜底值（只影响开发机本地调试安装，不会
// 进CI发布的Release，取值多少不重要）。
def ciVersionCode = System.getenv("APP_VERSION_CODE")

android {
    compileSdkVersion 26
    buildToolsVersion '27.0.3'

    defaultConfig {
        applicationId 'com.android.tvremoteime'
        minSdkVersion 14
        targetSdkVersion 15
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 12
        versionName "1.4.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug{
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release{
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-project.txt'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile project(path: ':ijkplayer')
    compile project(path: ':AdbLib')
    compile project(path: ':DroidDLNA')
    // 用于注册tvremoteime.local这个mDNS主机名，局域网IP变化时控制端地址依旧可用。
    // 排除jmdns自带的slf4j-api 2.0.7：一是它的字节码老版D8/AGP 3.1.0编译不了，
    // 二是DroidDLNA（给Cling用）已经内置了slf4j-api-1.6.1.jar，会跟任何新引入的
    // slf4j-api版本在dex合并阶段发生类重复冲突。slf4j的基础日志接口很多年没变过，
    // 复用DroidDLNA现有的1.6.1完全够用。
    compile('org.jmdns:jmdns:3.5.9') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

}