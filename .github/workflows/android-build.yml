name: Android Build

# 项目使用的老工具链（Gradle 4.4 + AGP 3.1.0）需要JDK 8，且compileSdkVersion 26 /
# buildToolsVersion 27.0.3是固定的，所以这里手动装SDK而不是升级工具链版本，
# 以保持跟本地构建、跟老设备兼容性完全一致（不改minSdkVersion/targetSdkVersion）。
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CMDLINE_TOOLS_VERSION: "9477386"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-platform26-buildtools27.0.3

      - name: Install Android SDK (platform 26 / build-tools 27.0.3)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-26" "build-tools;27.0.3"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Maven Central对匿名请求有临时限流(429)，构建工具链里有部分依赖是首次拉取，
      # 偶发429属正常现象，重试几次即可，跟代码/配置无关。
      - name: Build debug APK
        run: |
          set +e
          for i in 1 2 3 4 5; do
            ./gradlew :IMEService:assembleDebug --stacktrace
            rc=$?
            if [ $rc -eq 0 ]; then exit 0; fi
            echo "第 $i 次构建失败（可能是依赖仓库临时限流），等待重试..."
            sleep $((i * 10))
          done
          exit 1

      - name: Build release APK (unsigned)
        run: |
          set +e
          for i in 1 2 3 4 5; do
            ./gradlew :IMEService:assembleRelease --stacktrace
            rc=$?
            if [ $rc -eq 0 ]; then exit 0; fi
            echo "第 $i 次构建失败（可能是依赖仓库临时限流），等待重试..."
            sleep $((i * 10))
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-debug
          path: IMEService/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-release-unsigned
          path: IMEService/build/outputs/apk/release/*.apk
          if-no-files-found: error
