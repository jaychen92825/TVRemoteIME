name: Android Build

# 项目使用的老工具链（Gradle 4.4 + AGP 3.1.0）需要JDK 8，且compileSdkVersion 26 /
# buildToolsVersion 27.0.3是固定的，所以这里手动装SDK而不是升级工具链版本，
# 以保持跟本地构建、跟老设备兼容性完全一致（不改minSdkVersion/targetSdkVersion）。
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CMDLINE_TOOLS_VERSION: "9477386"
  # 各子模块compileSdkVersion/buildToolsVersion不完全一致：
  # IMEService/thunder用26/27.0.3，DroidDLNA/ijkplayer用25/26.0.2。
  # 全部显式安装，不依赖AGP的"缺什么自动联网下载"行为（那个行为不稳定，CI上
  # 遇到过间歇性连接失败）。

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布Release需要contents:write，覆盖掉workflow级别默认的contents:read
    # （只影响这一个job，其它job/未来新增的job仍然维持只读的默认最小权限）。
    permissions:
      contents: write
    # if:条件里不能直接引用secrets这个上下文（GitHub Actions工作流语法层面就不
    # 支持，会在解析阶段直接报"Unrecognized named-value: 'secrets'"，跑都跑不
    # 起来），得先在job级别的env里转一手，再在下面步骤的if里读env.*。
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ env.CMDLINE_TOOLS_VERSION }}-p25-p26-bt26.0.2-bt27.0.3-v2

      # sdkmanager本身（新版cmdline-tools）需要JDK 11+才能运行，这里先用JDK 17跑
      # sdkmanager，装完SDK后再在下面切到JDK 8去跑Gradle构建（Gradle 4.4 +
      # AGP 3.1.0这套老工具链只能在JDK 8下跑，两者互不兼容，必须分两段设置JAVA_HOME）。
      - name: Set up JDK 17 (for sdkmanager)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (platforms 25/26, build-tools 26.0.2/27.0.3)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-25" "platforms;android-26" \
            "build-tools;26.0.2" "build-tools;27.0.3"

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Maven Central对匿名请求有临时限流(429)，构建工具链里有部分依赖是首次拉取，
      # 偶发429属正常现象，重试几次即可，跟代码/配置无关。
      - name: Build debug APK
        run: |
          set +e
          for i in 1 2 3 4 5; do
            ./gradlew :IMEService:assembleDebug --stacktrace
            rc=$?
            if [ $rc -eq 0 ]; then exit 0; fi
            echo "第 $i 次构建失败（可能是依赖仓库临时限流），等待重试..."
            sleep $((i * 10))
          done
          exit 1

      # 仓库Secret里配了RELEASE_KEYSTORE_BASE64才会走这一步（fork PR不带Secret，
      # 这里会自然跳过，release包会退回未签名，安全默认值）。解码出来的keystore文件
      # 写到本次运行的临时目录，构建结束后随runner一起销毁，不会留存或进版本库。
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set +e
          for i in 1 2 3 4 5; do
            ./gradlew :IMEService:assembleRelease --stacktrace
            rc=$?
            if [ $rc -eq 0 ]; then exit 0; fi
            echo "第 $i 次构建失败（可能是依赖仓库临时限流），等待重试..."
            sleep $((i * 10))
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-debug
          path: IMEService/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-release
          path: IMEService/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # App内"检查更新"功能读的就是这个Release：只在push到master、且配置了release
      # 签名密钥（未签名的APK根本装不上，发布出去没有意义）时才发布。tag固定用
      # "v<versionCode>"这个格式而不是滚动的"latest"标签——这样App直接从tag名解析
      # 版本号做数值比较即可，不需要额外接口，也顺带保留了每个历史版本各自的下载
      # 记录；versionCode没有变化时重复push到master会更新同一个tag对应的Release
      # (软件行为，不是bug)，版本号变了则会创建一个新的Release。
      - name: Extract version info
        if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' && env.HAS_RELEASE_SIGNING == 'true' }}
        id: appver
        run: |
          set -e
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' IMEService/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' IMEService/build.gradle)
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release APK to GitHub Release
        if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' && env.HAS_RELEASE_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.code }}
          name: "TVRemoteIME v${{ steps.appver.outputs.name }} (build ${{ steps.appver.outputs.code }})"
          body: |
            自动构建发布，来自commit ${{ github.sha }}。

            App内"检查更新"功能依赖这个Release的tag格式(v<versionCode>)和附带的
            release APK，请不要手动修改/删除。
          files: IMEService/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
